stages:
  download:
    cmd: python main.py stage=download
    deps:
      - main.py
      - Config
      - Src/credit_fraud
    outs:
      - Data/raw/creditcard.csv

  split:
    cmd: python main.py stage=split
    deps:
      - main.py
      - Config
      - Src/credit_fraud
      - Data/raw/creditcard.csv
    outs:
      - Data/intermediate/train.csv
      - Data/intermediate/test.csv
    metrics:
      - Reports/data_split.json:
          cache: false

  features:
    cmd: python main.py stage=features
    deps:
      - main.py
      - Config
      - Src/credit_fraud
      - Data/intermediate/train.csv
      - Data/intermediate/test.csv
    outs:
      - Data/final/train.csv
      - Data/final/test.csv
      - Artifacts/preprocessor.pkl
    metrics:
      - Reports/features.json:
          cache: false

  train_xgboost_smote:
    cmd: python main.py stage=train model=xgboost sampler=smote mlflow.run_name=xgboost-smote paths.model=Models/experiments/xgboost_smote/model.pkl paths.reports_dir=Reports/experiments/xgboost_smote
    deps:
      - main.py
      - Config
      - Src/credit_fraud
      - Data/intermediate/train.csv
    outs:
      - Models/experiments/xgboost_smote/model.pkl
      - Reports/experiments/xgboost_smote/mlflow_run.json:
          cache: false
    metrics:
      - Reports/experiments/xgboost_smote/cv_metrics.json:
          cache: false
      - Reports/experiments/xgboost_smote/train_metrics.json:
          cache: false

  evaluate_xgboost_smote:
    cmd: python main.py stage=evaluate model=xgboost sampler=smote mlflow.run_name=xgboost-smote paths.model=Models/experiments/xgboost_smote/model.pkl paths.reports_dir=Reports/experiments/xgboost_smote
    deps:
      - main.py
      - Config
      - Src/credit_fraud
      - Models/experiments/xgboost_smote/model.pkl
      - Reports/experiments/xgboost_smote/mlflow_run.json
      - Data/intermediate/test.csv
    outs:
      - Reports/experiments/xgboost_smote/figures
      - Reports/experiments/xgboost_smote/classification_report.json
      - Reports/experiments/xgboost_smote/confusion_matrix.json
      - Reports/experiments/xgboost_smote/model_registry.json
    metrics:
      - Reports/experiments/xgboost_smote/test_metrics.json:
          cache: false

  train_xgboost_borderline_smote:
    cmd: python main.py stage=train model=xgboost sampler=borderline_smote mlflow.run_name=xgboost-borderline-smote paths.model=Models/experiments/xgboost_borderline_smote/model.pkl paths.reports_dir=Reports/experiments/xgboost_borderline_smote

[project]
name = "imbalanced-creditcard-fraud-detection"
version = "0.1.0"
description = "Leakage-safe credit card fraud detection training pipeline."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "catboost>=1.2.10",
    "dvc>=3.67.1",
    "dvc-http>=2.32.0",
    "hydra-core>=1.3.2",
    "imbalanced-learn>=0.14.1",
    "kaggle>=1.7.4",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.9",
    "missingno>=0.5.2",
    "mlflow>=2.22.0",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.3",
    "pytest>=8.4.0",
    "ruff>=0.14.0",
    "scikit-learn>=1.6,<2",
    "scipy>=1.14,<2",
    "seaborn>=0.13.2",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["Src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["Src"]

[tool.ruff]
line-length = 100
target-version = "py313"
